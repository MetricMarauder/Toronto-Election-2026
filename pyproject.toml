# Makes this folder an installable package. After
#     pip install -e .
# the command `election-map` (and `python -m election_map`) works from ANY folder,
# and edits to the code take effect immediately (-e = "editable").
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "election_map"
version = "0.1.0"
description = "Turn poll-by-poll election spreadsheets into interactive maps"
requires-python = ">=3.9"
dependencies = ["pandas", "openpyxl", "geopandas", "folium", "mapclassify", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

[project.scripts]
# Your own version, built step by step in practice/ (see BUILD_IT_YOURSELF.md)
my-election-map = "my_election_map.cli:main"

[tool.setuptools]
packages = ["my_election_map"]

[tool.setuptools.package-dir]
# my_election_map lives in practice/, not the top folder
my_election_map = "practice/my_election_map"

[tool.pytest.ini_options]
# `python -m pytest -rs` runs your practice checkers.
testpaths = ["practice"]
