# Project settings. After `pip install -e .` you can `import my_map` from any
# folder, and edits to your code take effect immediately (-e = "editable").
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "election_map"
version = "0.1.0"
description = "Turn poll-by-poll election spreadsheets into interactive maps"
requires-python = ">=3.9"
dependencies = ["pandas", "openpyxl", "geopandas", "folium", "mapclassify", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

[tool.setuptools]
# your code: practice/my_map.py  (so `import my_map` works anywhere)
py-modules = ["my_map"]
package-dir = {"" = "practice"}

[tool.pytest.ini_options]
# `python -m pytest -rs` runs the checks for your 4 steps.
testpaths = ["practice"]
